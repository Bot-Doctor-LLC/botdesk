name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/release-channel.test.cjs
      - run: npx vitest run --maxWorkers=2
      - run: npx tsc --noEmit
      - run: npm run host:build
      - run: npm run test:host -- --maxWorkers=2
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - run: npm run build
      - name: Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Rust Linux compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace
      - name: Rust lint and Linux compile
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
